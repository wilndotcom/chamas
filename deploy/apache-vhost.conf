# THE TEAM - Apache virtual host
#
# For XAMPP users, whose Apache already holds port 80.
#
# Copy into C:\xampp\apache\conf\extra\httpd-vhosts.conf, then make sure
# httpd.conf has this line uncommented:
#
#     Include conf/extra/httpd-vhosts.conf
#
# Then restart Apache from the XAMPP control panel.
#
# Change ServerName, DocumentRoot and the /the-team prefix to your own address.
# built frontend on this machine.

<VirtualHost *:80>
    ServerName localhost
    # Add your own host here if you have one.
    # ServerAlias chama.example.com

    # Where the built frontend lives on disk.
    DocumentRoot "C:/Users/WILNWORLD/Documents/Default Project/the-team/frontend/dist-xampp"

    <Directory "C:/Users/WILNWORLD/Documents/Default Project/the-team/frontend/dist-xampp">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Deep links such as /admin/settings are handled by the app, not by a
        # file on disk. Without this, refreshing one returns 404 - which breaks
        # every link anyone shares or bookmarks.
        #
        # mod_rewrite is required. It is enabled by default in XAMPP's httpd.conf
        # but worth checking if deep links 404.
        <IfModule mod_rewrite.c>
            RewriteEngine On

            # The API goes to the PHP backend rather than to the static files.
            # If this were missed, every request would get the HTML page where
            # JSON was expected and the app would appear broken.
            # The prefix here must match the folder name and APP_BASE_PATH.
            # DocumentRoot already sits inside /the-team, so the incoming path
            # keeps the prefix and the whole thing is forwarded on.
            RewriteCond %{REQUEST_URI} ^/the-team/api/
            RewriteRule ^/the-team/api/(.*)$ backend/index.php/$1 [END,L]

            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Everything else is an app route.
            RewriteRule ^ /index.html [L]
        </IfModule>
    </Directory>

    # Hashed filenames: a cache hit is always the right version, so cache hard.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The shell names the hashed files, so caching it pins people to a page
    # pointing at files that no longer exist. Never cache it.
    <LocationMatch "^/(index\.html|sw\.js)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header unset Expires
    </LocationMatch>

    # Not needed for the app to work, but these headers are free and a member
    # entering a password on a shared phone benefits.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog "logs/the-team-error.log"
    CustomLog "logs/the-team-access.log" common
</VirtualHost>