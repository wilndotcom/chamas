# THE TEAM - Apache config for XAMPP
#
# TWO WAYS TO DEPLOY. Pick one.
#
#   Option A (recommended) - drop the folder into htdocs.
#     No Apache configuration at all. Nothing here is needed.
#     The app's own .htaccess handles the rewriting.
#     Use this if you are unsure.
#
#   Option B - keep the project where it is and point Apache at it.
#     Use this if you would rather not copy files into htdocs, or if you want to
#     keep working in your editor's directory and edit in place.
#
# Both end up at the same URL: http://localhost/the-team
#
# ------------------------------------------------------------------
# OPTION B
# ------------------------------------------------------------------
#
# 1. Copy this file into:  C:\xampp\apache\conf\extra\the-team.conf
#
# 2. Open:  C:\xampp\apache\conf\httpd.conf
#    Find the line:
#        #Include conf/extra/httpd-vhosts.conf
#    and add this line directly below it (outside any <VirtualHost> block):
#        Include conf/extra/the-team.conf
#
# 3. Restart Apache from the XAMPP control panel.
#
# 4. If deep links such as /the-team/admin/settings return 404, mod_rewrite is
#    not enabled. In httpd.conf, find:
#        #LoadModule rewrite_module modules/mod_rewrite.so
#    and remove the # at the start. XAMPP normally enables this already.
#
# DocumentRoot points at the built frontend. The PHP backend lives alongside it
# rather than inside it, so a rebuild of the frontend cannot overwrite or delete
# the code that runs the app.

<VirtualHost *:80>
    ServerName localhost

    # The built frontend.
    DocumentRoot "C:/Users/WILNWORLD/Documents/Default Project/the-team/frontend/dist"

    # The PHP backend. Only reached through the rewrite rules below; nothing here
    # is browsable directly.
    Alias "C:/Users/WILNWORLD/Documents/Default Project/the-team/backend-php/public" "/the-team/backend"

    <Directory "C:/Users/WILNWORLD/Documents/Default Project/the-team/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "C:/Users/WILNWORLD/Documents/Default Project/the-team/backend-php/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Anything outside the built frontend - the assets folder is the only one -
    # needs its rewrite rules too. Without this block, /the-team/assets/... is a
    # plain filesystem request that Apache serves from the wrong place.
    <Directory "C:/Users/WILNWORLD/Documents/Default Project/the-team">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<Directory "C:/Users/WILNWORLD/Documents/Default Project/the-team/frontend/dist">
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /the-team/

        # Real files and folders are served as-is. This comes first so the
        # hashed assets are found before anything rewrites them.
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # The API goes to the PHP backend. If this were missed, every API call
        # would receive the HTML page where JSON was expected, and the app would
        # fail with a parse error that points nowhere near the cause.
        RewriteCond %{REQUEST_URI} ^/the-team/api/
        RewriteRule ^/the-team/api/(.*)$ /the-team/backend/index.php [QSA,L]

        # Everything else is an app route handled in the browser. Serving
        # index.html here is what makes a bookmarked or shared link work.
        RewriteRule ^ index.html [L]
    </IfModule>
</Directory>

# Hashed filenames: a cache hit is always the right version, so cache hard.
<LocationMatch "^/the-team/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# The shell names the hashed files, so caching it would pin people to a page
# pointing at files that no longer exist. Never cache it.
<LocationMatch "^/the-team/(index\.html|sw\.js)$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header unset Expires
</LocationMatch>

# Free headers, and worth having: members enter passwords on shared phones here.
<LocationMatch "^/the-team">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog "logs/the-team-error.log"
    CustomLog "logs/the-team-access.log" common
</LocationMatch>